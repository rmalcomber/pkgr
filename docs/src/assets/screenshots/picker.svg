<svg xmlns="http://www.w3.org/2000/svg" width="636" height="240" viewBox="0 0 636 240" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="16" role="img" aria-label="pkgr: pick a task"><rect width="636" height="240" rx="10" fill="#20252e"/><rect width="636" height="32" rx="10" fill="#272c36"/><rect y="22" width="636" height="10" fill="#272c36"/><circle cx="18" cy="16" r="6" fill="#4c5667"/><circle cx="38" cy="16" r="6" fill="#4c5667"/><circle cx="58" cy="16" r="6" fill="#4c5667"/><text x="318" y="21" text-anchor="middle" fill="#8794a6" font-size="13" font-family="system-ui, sans-serif">pkgr: pick a task</text><text x="20" y="59" fill="#8fdde8" xml:space="preserve">$ </text><text x="39.2" y="59" fill="#d3dce6" xml:space="preserve">pkgr</text><text x="20" y="103" fill="#d3dce6" font-weight="700" xml:space="preserve">Select a task  (package.json)</text><rect x="20" y="110" width="288" height="22" fill="#d3dce6"/><text x="20" y="125" fill="#20252e" xml:space="preserve">> dev             pnpm run dev</text><text x="20" y="147" fill="#d3dce6" xml:space="preserve">  build           pnpm run build</text><text x="20" y="169" fill="#d3dce6" xml:space="preserve">  test            pnpm run test</text><text x="20" y="191" fill="#d3dce6" xml:space="preserve">  lint            pnpm run lint</text><text x="20" y="213" fill="#8794a6" xml:space="preserve">  up/down move · type to filter · enter run · esc cancel</text></svg>
